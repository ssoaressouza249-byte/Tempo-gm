name: Build Temp GM APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descompactando $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE" -d temp_extract
            if [ -f "temp_extract/settings.gradle.kts" ] || [ -f "temp_extract/build.gradle.kts" ]; then
              cp -rf temp_extract/* .
            else
              SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -rf "$SUBDIR"/* .
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Fix Gradle 9 Configuration (Keep App & SecurityGuard 100% Untouched)
        run: |
          rm -rf app/src/test app/src/androidTest

          if [ -f "build.gradle.kts" ]; then
            sed -i '/google-services/d' build.gradle.kts
            sed -i '/secrets-gradle-plugin/d' build.gradle.kts
            sed -i '/kotlin.android/d' build.gradle.kts
          fi

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.raylan.tempgm"
              compileSdk = 36

              defaultConfig {
                  applicationId = "com.raylan.tempgm"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation(platform("androidx.compose:compose-bom:2025.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended:1.7.8")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          if [ -f "gradle/libs.versions.toml" ]; then
            sed -i 's/compileSdk = "[0-9]*"/compileSdk = "36"/g' gradle/libs.versions.toml
            sed -i 's/targetSdk = "[0-9]*"/targetSdk = "36"/g' gradle/libs.versions.toml
          fi

          echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug -x lint --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TempGM-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
